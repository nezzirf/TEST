<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports TCG Elite - Jeu de Booster</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-gold: #f59e0b;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: var(--accent-gold); margin-bottom: 5px; }
        .subtitle { color: #94a3b8; margin-top: 0; font-size: 0.9rem; }
        
        .game-container {
            width: 100%;
            max-width: 600px;
        }
        
        .panel {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        
        .booster-zone {
            text-align: center;
            background: linear-gradient(135deg, #1e1b4b, #311042);
            border: 2px solid var(--accent-gold);
        }
        
        button {
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            width: 100%;
        }
        button:hover { background-color: #fbbf24; transform: scale(1.02); }
        button:disabled { background-color: #475569; color: #94a3b8; cursor: not-allowed; transform: none; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .stat-box { background: #0f172a; padding: 10px; border-radius: 6px; text-align: center; }
        
        .cards-display {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            min-height: 100px;
        }
        .tcg-card {
            background: linear-gradient(185deg, #3b82f6, #1d4ed8);
            border: 2px solid #fff;
            border-radius: 8px;
            width: 80px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            text-align: center;
            padding: 5px;
            box-sizing: border-box;
            animation: pop 0.3s ease-out;
        }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="game-container">
    <div style="text-align: center;">
        <h1>SPORTS TCG ELITE</h1>
        <p class="subtitle">100% ATHLÈTES ACTIFS — PACKS LIMITÉS</p>
    </div>

    <!-- ZONE BOOSTER -->
    <div class="panel booster-zone">
        <h3>Partie haute du booster</h3>
        <p>Ouvrir Boosters Mon Équipe Collection</p>
        <button id="btn-booster">OUVRIR UN BOOSTER</button>
        
        <div class="stats-grid">
            <div class="stat-box">Paquets dispo : <span id="pack-count">12</span>/12</div>
            <div class="stat-box">Prochain : <span id="timer">00:05</span></div>
        </div>
        
        <!-- Zone où les cartes tirées vont apparaître temporairement -->
        <div class="cards-display" id="booster-result"></div>
    </div>

    <!-- GESTION DE L'ÉQUIPE -->
    <div class="panel">
        <h3>Gestion de l'équipe</h3>
        <p class="subtitle">Équipe Titulaire (5 Athlètes)</p>
        <button style="background-color: #475569; color: white;">+ Ajouter un athlète possédé</button>
    </div>

    <!-- BASE DE DONNÉES GLOBALE -->
    <div class="panel">
        <h3>Base de données globale</h3>
        <div class="stats-grid">
            <div class="stat-box">Débloqués : <span id="unlocked-count">0</span> / 3</div>
            <div class="stat-box" style="cursor:pointer; color:var(--accent);">Voir Possédés</div>
        </div>
    </div>
</div>

<script>
    // LISTE DE VOS ATHLÈTES (Exemple)
    const athletesPool = ["Mbappé 🇫🇷", "LeBron 🇺🇸", "Alcaraz 🇪🇸"];
    const collection = new Set();
    let packsLeft = 12;

    const btnBooster = document.getElementById('btn-booster');
    const packCountDisplay = document.getElementById('pack-count');
    const unlockedCountDisplay = document.getElementById('unlocked-count');
    const boosterResult = document.getElementById('booster-result');

    // LOGIQUE CLIC BOOSTER
    btnBooster.addEventListener('click', () => {
        if(packsLeft > 0) {
            packsLeft--;
            packCountDisplay.textContent = packsLeft;
            
            // Tirer un athlète au hasard
            const randomIndex = Math.floor(Math.random() * athletesPool.length);
            const cardWon = athletesPool[randomIndex];
            
            // Ajouter à la collection
            collection.add(cardWon);
            unlockedCountDisplay.textContent = collection.size;
            
            // Afficher visuellement la carte tirée
            boosterResult.innerHTML = `<div class="tcg-card">${cardWon}</div>`;
            
            if(packsLeft === 0) {
                btnBooster.disabled = true;
                btnBooster.textContent = "PLUS DE PAQUETS !";
            }
        }
    });

    // UN PETIT COMPTE À REBOURS DE TEST (5 secondes pour l'exemple)
    let timeLeft = 5;
    setInterval(() => {
        if(timeLeft > 0) {
            timeLeft--;
            document.getElementById('timer').textContent = "00:0" + timeLeft;
        } else {
            timeLeft = 5; // Reset automatique pour la démo
            if(packsLeft < 12) {
                packsLeft++;
                packCountDisplay.textContent = packsLeft;
                btnBooster.disabled = false;
                btnBooster.textContent = "OUVRIR UN BOOSTER";
            }
        }
    }, 1000);
</script>

</body>
</html>
